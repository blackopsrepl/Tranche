name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to publish (backfill)"
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BIN: tranche
  TARGET: x86_64-unknown-linux-gnu

jobs:
  verify:
    runs-on: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    needs: verify
    runs-on: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Build
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
          cargo build --locked --release --target "$TARGET" -p tranche-cli
      - name: Exercise it before shipping it
        run: |
          "./target/$TARGET/release/$BIN" --help
          version="${RELEASE_TAG#v}"
          reported=$("./target/$TARGET/release/$BIN" --version | awk '{print $NF}')
          test "$reported" = "$version" || {
            echo "the binary reports $reported but the tag is $version" >&2
            exit 1
          }
      - name: Package
        run: |
          name="$BIN-$RELEASE_TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$BIN" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dist
          path: dist

      # The notes are the tagged version's own CHANGELOG section: the generator
      # owns CHANGELOG.md, so the release can never drift from it.
      - name: Extract the tagged CHANGELOG section
        run: |
          version="${RELEASE_TAG#v}"
          body=$(awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\][ (]") {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "No CHANGELOG section for ${version} — cut the release with commit-and-tag-version first." >&2
            exit 1
          fi
          printf '%s\n' "$body" > release-notes.md

      # The job-scoped token expires with this run; no stored PAT is needed.
      - name: Publish and verify the Forgejo release
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-forgejo-release.cjs
