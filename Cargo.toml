[workspace]
resolver = "2"
members = ["crates/tranche-core", "crates/tranche-cli"]

[workspace.package]
version = "0.8.4"
edition = "2024"
authors = ["Vittorio Distefano <info@vdistefano.studio>"]
repository = "https://github.com/blackopsrepl/Tranche"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
