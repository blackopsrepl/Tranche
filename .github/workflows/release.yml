name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to publish (backfill)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BIN: tranche
  TARGET: x86_64-unknown-linux-gnu

jobs:
  # A tag can be pushed to a commit that never ran CI. The release is the last
  # chance to refuse, so the gate runs here too rather than only on master.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The binary is the product, so the release carries it rather than the tag
  # alone. Built and exercised before it is attached.
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release --target "$TARGET" -p tranche-cli
      - name: Exercise it before shipping it
        run: |
          "./target/$TARGET/release/$BIN" --help
          version="${RELEASE_TAG#v}"
          reported=$("./target/$TARGET/release/$BIN" --version | awk '{print $NF}')
          test "$reported" = "$version" || {
            echo "::error::the binary reports $reported but the tag is $version" >&2
            exit 1
          }
      - name: Verify standalone deployment with local fixtures
        run: python3 tests/smoke_standalone.py "./target/$TARGET/release/$BIN"
      - name: Package
        run: |
          name="$BIN-$RELEASE_TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$BIN" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The notes are the tagged version's own CHANGELOG section: the generator
      # owns CHANGELOG.md, so the release can never drift from it.
      - name: Extract the tagged CHANGELOG section
        run: |
          version="${RELEASE_TAG#v}"
          body=$(awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\][ (]") {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG section for ${version} — cut the release with commit-and-tag-version first." >&2
            exit 1
          fi
          printf '%s\n' "$body" > release-notes.md

      # The tag already exists on the push event, so create is passed no target:
      # it publishes the tag exactly as pushed. A rerun overwrites the attached
      # assets rather than failing on them.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --clobber dist/*.tar.gz dist/*.sha256
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file release-notes.md \
              dist/*.tar.gz dist/*.sha256
          fi

      # Read back what was published instead of trusting the upload.
      - name: Prove the release is complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,assets \
            --jq '"tag=\(.tagName) draft=\(.isDraft) assets=\(.assets|length)",
                  (.assets[] | "  \(.name) \(.size) bytes")'
          count=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets|length')
          test "$count" -ge 2 || {
            echo "::error::expected the archive and its checksum, found $count assets" >&2
            exit 1
          }
