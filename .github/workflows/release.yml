name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to publish (backfill)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # The release notes are the tagged tag's own CHANGELOG section: the
      # generator owns CHANGELOG.md, so this can never drift from it.
      - name: Extract the tagged CHANGELOG section
        run: |
          version="${RELEASE_TAG#v}"
          body=$(awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\][ (]") {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG section for ${version} — cut the release with commit-and-tag-version first." >&2
            exit 1
          fi
          printf '%s\n' "$body" > release-notes.md

      # The tag already exists on the push event, so create is passed no
      # target: it publishes the tag exactly as pushed.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
